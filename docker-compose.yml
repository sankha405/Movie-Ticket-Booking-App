version: "3.8"

services:

  backend:
    build: ./backend
    container_name: movie-backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Infy@1234
      DB_NAME: movie_booking

  frontend:
    build: ./frontend
    container_name: movie-frontend
    ports:
      - "3002:3000"
    depends_on:
      - backend